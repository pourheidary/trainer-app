<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exercise library</title>
<style>
:root{--bg:#eef1f4;--surface:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d6dde4;--accent:#1f5fd6;--on-accent:#fff;--danger:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--surface:#18222c;--ink:#e8eef3;--mute:#93a3b2;--line:#2a3743;--accent:#6b9bff;--on-accent:#0b1220;--danger:#ff8a80}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:20px clamp(16px,4vw,40px) 8px}
h1{margin:0;font-size:1.6rem;letter-spacing:-.01em}
h1 small{font-size:.9rem;font-weight:400;color:var(--mute);margin-left:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:8px clamp(16px,4vw,40px) 16px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:100%}
.bar input{flex:2 1 220px;width:auto}.bar select{flex:1 1 140px;width:auto}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.danger{color:var(--danger)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{padding:0 clamp(16px,4vw,40px) 40px}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--accent)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#fff;display:block}
.card div{padding:10px 12px 12px}
.card b{display:block;font-size:.95rem;line-height:1.3;margin-bottom:4px}
.tag{font-size:.8rem;color:var(--mute)}
.mark{font-size:.75rem;color:var(--accent);margin-left:6px}
.more{display:block;margin:24px auto 0}
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;max-width:640px}
code{background:var(--bg);padding:2px 6px;border-radius:4px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);width:min(560px,94vw);padding:0}
dialog::backdrop{background:rgba(10,18,26,.55)}
.dlg{padding:20px;display:grid;gap:12px}
.dlg h2{margin:0;font-size:1.25rem}
.dlg label{display:grid;gap:4px;font-size:.9rem;color:var(--mute)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{display:flex;gap:14px;align-items:center}
.pic img{width:110px;height:110px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#fff}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.acts .left{margin-right:auto}
footer{padding:0 clamp(16px,4vw,40px) 28px;color:var(--mute);font-size:.85rem}
</style>
</head>
<body>
<header>
  <h1>Exercise library<small id="count"></small></h1>
  <div class="acts">
    <button id="exportBtn">Export backup</button>
    <button id="importBtn">Import backup</button>
    <button id="addBtn" class="primary">Add exercise</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</header>
<div class="bar">
  <input id="q" type="search" placeholder="Search by name" aria-label="Search by name">
  <select id="fBody" aria-label="Body part"></select>
  <select id="fTarget" aria-label="Target muscle"></select>
  <select id="fEquip" aria-label="Equipment"></select>
</div>
<main>
  <div id="grid"></div>
  <button id="more" class="more" hidden>Show more</button>
</main>
<footer>Images © Gym visual (gymvisual.com), included for non-commercial use only.</footer>

<dialog id="dlg">
  <div class="dlg">
    <h2 id="dlgTitle">Edit exercise</h2>
    <div class="pic">
      <img id="preview" alt="">
      <label>Image<input id="fImg" type="file" accept="image/*"></label>
    </div>
    <label>Name<input id="eName"></label>
    <div class="two">
      <label>Body part<input id="eBody" list="bodyList"></label>
      <label>Target muscle<input id="eTarget" list="targetList"></label>
    </div>
    <div class="two">
      <label>Equipment<input id="eEquip" list="equipList"></label>
      <label>Secondary muscles (comma separated)<input id="eSec"></label>
    </div>
    <label>Instructions<textarea id="eInstr" rows="5"></textarea></label>
    <datalist id="bodyList"></datalist><datalist id="targetList"></datalist><datalist id="equipList"></datalist>
    <div class="acts">
      <button id="delBtn" class="danger left" hidden></button>
      <button id="cancelBtn">Cancel</button>
      <button id="saveBtn" class="primary">Save changes</button>
    </div>
  </div>
</dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let base = [], state = { over: {}, custom: {} }, all = [], shown = 60, editing = null, newImage = null;

/* ---------- storage (IndexedDB, stays in this browser) ---------- */
const open = () => new Promise((res, rej) => {
  const r = indexedDB.open('trainer-app', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function load() {
  try {
    const db = await open();
    return await new Promise(res => {
      const q = db.transaction('kv').objectStore('kv').get('state');
      q.onsuccess = () => res(q.result); q.onerror = () => res(null);
    });
  } catch (e) { return null; }
}
async function save() {
  try {
    const db = await open();
    await new Promise((res, rej) => {
      const t = db.transaction('kv', 'readwrite');
      t.objectStore('kv').put(state, 'state');
      t.oncomplete = res; t.onerror = () => rej(t.error);
    });
  } catch (e) { alert('Could not save in this browser. Use Export backup to keep your changes.'); }
}

/* ---------- data ---------- */
const norm = e => ({
  id: e.id, name: e.name || '', body_part: e.body_part || '', target: e.target || '',
  equipment: e.equipment || '', secondary: [...new Set(e.secondary_muscles || [])].join(', '),
  instructions: (e.instructions && e.instructions.en) || '', image: e.image || '', gif: e.gif_url || ''
});
function merge() {
  all = base.map(e => state.over[e.id] ? { ...norm(e), ...state.over[e.id], edited: true } : norm(e))
    .concat(Object.values(state.custom).map(e => ({ ...e, custom: true })));
  all.sort((a, b) => a.name.localeCompare(b.name));
}

/* ---------- list ---------- */
function fillSelect(sel, key, label) {
  const cur = sel.value;
  const vals = [...new Set(all.map(e => e[key]).filter(Boolean))].sort();
  sel.innerHTML = `<option value="">${label}</option>` + vals.map(v => `<option>${esc(v)}</option>`).join('');
  sel.value = vals.includes(cur) ? cur : '';
}
function fillLists() {
  fillSelect($('#fBody'), 'body_part', 'All body parts');
  fillSelect($('#fTarget'), 'target', 'All target muscles');
  fillSelect($('#fEquip'), 'equipment', 'All equipment');
  for (const [id, key] of [['bodyList','body_part'],['targetList','target'],['equipList','equipment']])
    $('#' + id).innerHTML = [...new Set(all.map(e => e[key]).filter(Boolean))].sort().map(v => `<option value="${esc(v)}">`).join('');
}
function render() {
  const q = $('#q').value.trim().toLowerCase(), b = $('#fBody').value, t = $('#fTarget').value, eq = $('#fEquip').value;
  const list = all.filter(e => (!q || e.name.toLowerCase().includes(q)) && (!b || e.body_part === b) && (!t || e.target === t) && (!eq || e.equipment === eq));
  $('#count').textContent = `${list.length} of ${all.length}`;
  $('#grid').innerHTML = list.slice(0, shown).map(e => `
    <button class="card" data-id="${esc(e.id)}">
      ${e.image ? `<img src="${esc(e.image)}" alt="" loading="lazy">` : '<img alt="">'}
      <div><b>${esc(e.name)}${e.edited || e.custom ? '<span class="mark">edited</span>' : ''}</b>
      <span class="tag">${esc(e.target)}${e.target && e.body_part ? ' · ' : ''}${esc(e.body_part)}</span></div>
    </button>`).join('') || '<p>No exercises match your filters.</p>';
  $('#more').hidden = list.length <= shown;
}

/* ---------- edit dialog ---------- */
function openEdit(id) {
  editing = id; newImage = null; $('#fImg').value = '';
  const e = id ? all.find(x => x.id === id) : { name: '', body_part: '', target: '', equipment: '', secondary: '', instructions: '', image: '' };
  $('#dlgTitle').textContent = id ? 'Edit exercise' : 'Add exercise';
  $('#eName').value = e.name; $('#eBody').value = e.body_part; $('#eTarget').value = e.target;
  $('#eEquip').value = e.equipment; $('#eSec').value = e.secondary; $('#eInstr').value = e.instructions;
  $('#preview').src = e.gif || e.image || '';
  const del = $('#delBtn');
  del.hidden = !(e.custom || e.edited);
  del.textContent = e.custom ? 'Delete exercise' : 'Restore original';
  $('#dlg').showModal();
}
async function saveEdit() {
  const name = $('#eName').value.trim();
  if (!name) { $('#eName').focus(); return; }
  const cur = editing ? all.find(x => x.id === editing) : null;
  const obj = {
    id: editing || 'c' + Date.now(), name, body_part: $('#eBody').value.trim(), target: $('#eTarget').value.trim(),
    equipment: $('#eEquip').value.trim(), secondary: $('#eSec').value.trim(), instructions: $('#eInstr').value.trim(),
    image: newImage || (cur ? cur.image : ''),
    gif: newImage ? '' : (cur ? cur.gif || '' : '')
  };
  if (!cur || cur.custom) state.custom[obj.id] = obj; else state.over[obj.id] = obj;
  await save(); merge(); fillLists(); render(); $('#dlg').close();
}
async function removeEdit() {
  const e = all.find(x => x.id === editing);
  if (e.custom) { if (!confirm('Delete this exercise?')) return; delete state.custom[e.id]; }
  else delete state.over[e.id];
  await save(); merge(); fillLists(); render(); $('#dlg').close();
}
function shrink(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 480 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', .85));
    };
    img.onerror = rej; img.src = url;
  });
}

/* ---------- events ---------- */
$('#grid').addEventListener('click', ev => { const c = ev.target.closest('.card'); if (c) openEdit(c.dataset.id); });
$('#addBtn').onclick = () => openEdit(null);
$('#saveBtn').onclick = saveEdit;
$('#cancelBtn').onclick = () => $('#dlg').close();
$('#delBtn').onclick = removeEdit;
$('#more').onclick = () => { shown += 60; render(); };
for (const id of ['#q', '#fBody', '#fTarget', '#fEquip']) $(id).addEventListener('input', () => { shown = 60; render(); });
$('#fImg').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { newImage = await shrink(f); $('#preview').src = newImage; } catch (_) { alert('That file could not be read as an image.'); }
};
$('#exportBtn').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state)], { type: 'application/json' }));
  a.download = 'exercise-edits.json'; a.click();
};
$('#importBtn').onclick = () => $('#importFile').click();
$('#importFile').onchange = async e => {
  try {
    const d = JSON.parse(await e.target.files[0].text());
    state.over = { ...state.over, ...(d.over || {}) }; state.custom = { ...state.custom, ...(d.custom || {}) };
    await save(); merge(); fillLists(); render();
  } catch (_) { alert('That file is not a valid backup.'); }
  e.target.value = '';
};

/* ---------- start ---------- */
(async () => {
  const saved = await load(); if (saved) state = { over: saved.over || {}, custom: saved.custom || {} };
  try {
    const r = await fetch('data/exercises.json'); if (!r.ok) throw 0;
    base = await r.json();
  } catch (_) {
    $('#grid').innerHTML = `<div class="msg"><b>Could not load data/exercises.json.</b><p>Put this file in the dataset folder (next to <code>data</code> and <code>images</code>), open a terminal there, and run <code>python3 -m http.server 8000</code>. Then open <code>http://localhost:8000</code> in your browser.</p></div>`;
    return;
  }
  merge(); fillLists(); render();
})();
</script>
</body>
</html>
